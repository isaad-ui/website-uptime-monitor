services:
  - type: web
    name: uptime-monitor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REQUEST_TIMEOUT
        value: 10
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGIN
        value: ""   # Set this to your Netlify URL after deploying, e.g. https://your-app.netlify.app
