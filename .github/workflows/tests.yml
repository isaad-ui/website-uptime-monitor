name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests==2.34.2 pytest==8.2.2 fastapi==0.115.12 uvicorn==0.34.2 httpx==0.28.1
        # pip-system-certs is Windows-only and not needed on Ubuntu

      - name: Patch Windows-only import for CI
        run: |
          sed -i 's/import pip_system_certs.wrapt_requests//' website-uptime-monitor/main.py

      - name: Verify config loads
        run: |
          cd website-uptime-monitor
          python -c "import config; print('REQUEST_TIMEOUT:', config.REQUEST_TIMEOUT)"

      - name: Run CLI tests
        run: |
          cd website-uptime-monitor
          python -m pytest test_main.py -v

      - name: Run API tests
        run: |
          cd backend
          python -m pytest test_api.py -v